<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Live Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body style="font-family: Arial; padding: 20px;">
<h2>Receiver's Notification Box (Wallet ID: 2)</h2>
<div id="notifications" style="padding: 10px; border: 1px solid green; background: #eaffea;">
    Waiting for money...
</div>

<script>
    // ব্যাকএন্ডের সকেটের সাথে কানেক্ট করা
    let socket = new SockJS('http://localhost:8080/ws');
    let stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);

        // রিসিভার আইডি 2-এর জন্য সাবস্ক্রাইব করা
        stompClient.subscribe('/topic/notifications/2', function (message) {
            document.getElementById("notifications").innerHTML += "<p>🔔 " + message.body + "</p>";
        });
    });
</script>
</body>
</html>
